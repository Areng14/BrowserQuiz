# BrowserQuiz: self-host anywhere with Docker.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose pull && docker compose up -d
#
# pull downloads the ready-made images (where it can't, up builds them here instead). Plain HTTP on port 8080
# (good for trying it out). For a real class, put it behind HTTPS:
#   set DOMAIN in .env, then: docker compose --profile https up -d
services:
  app:
    image: ghcr.io/areng14/browserquiz-app:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET: ${ADMIN_RESET:-}
      ID_PEPPER: ${ID_PEPPER:?set ID_PEPPER in .env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      RUNNER_URL: http://runner:8080
      # Where students join, shown on the live page and the projector view: this computer's network
      # address (setup.sh and setup.ps1 pass it in), or STUDENT_URL to set it outright.
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      STUDENT_URL: ${STUDENT_URL:-}
      RUNNER_CONCURRENCY: ${RUNNER_SLOTS:-4}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional: one AI grading key for every teacher (docs/setup.md). Teachers can also add their own.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_GRADER_MODEL: ${AI_GRADER_MODEL:-}
      OPENAI_GRADER_MODEL: ${OPENAI_GRADER_MODEL:-}
      GEMINI_GRADER_MODEL: ${GEMINI_GRADER_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - bq-data:/data
    networks: [web, sandbox]
    depends_on: [runner]

  # Student code runs here. Its network is internal: no internet, it can only answer the app.
  # RUNNER_LANGS: standard (Java, Python, JavaScript, TypeScript) or full (all nine languages, 5x the size)
  runner:
    image: ghcr.io/areng14/browserquiz-runner:${RUNNER_LANGS:-standard}
    build:
      context: ./runner
      args:
        RUNNER_LANGS: ${RUNNER_LANGS:-standard}
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      RUNNER_SLOTS: ${RUNNER_SLOTS:-4}
    # Each slot's jobs on a tmpfs of its own, so one job filling its disk can't starve the others' (with more
    # than 4 RUNNER_SLOTS, the extra slots share the container's disk, with only the runner's per-job budget).
    # exec: a compiled answer runs from here (Landlock lets only that job's own program run).
    tmpfs:
      - /jobs/0:size=64m,mode=0711,exec
      - /jobs/1:size=64m,mode=0711,exec
      - /jobs/2:size=64m,mode=0711,exec
      - /jobs/3:size=64m,mode=0711,exec
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL, DAC_OVERRIDE, FOWNER]
    mem_limit: ${RUNNER_MEMORY:-2g}
    cpus: ${RUNNER_CPUS:-2}
    pids_limit: 1024
    networks: [sandbox]

  # Optional HTTPS with an automatic certificate. Needs a domain pointing at this machine.
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [web]
    depends_on: [app]

networks:
  web: {}
  sandbox:
    internal: true

volumes:
  bq-data: {}
  caddy-data: {}
