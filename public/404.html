<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found - BrowserQuiz</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/app.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); }
    .panel > a.btn { display: inline-flex; align-items: center; justify-self: start; text-decoration: none; }
  </style>
</head>
<body>
  <!-- What the server sends a browser for an address it doesn't have (index.js). Absolute paths: it's sent at any depth. -->
  <div class="bq-app"><main class="screen center"><div class="panel">
    <p class="eyebrow">BrowserQuiz</p>
    <h1>Page not found</h1>
    <a class="btn primary" href="/">Go to the start</a>
  </div></main></div>
</body>
</html>
