<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student screen</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    html, body { height: 100%; margin: 0; }
    /* The app fills the window and scrolls inside itself; the page never scrolls (not on phones, where the
       keyboard needs to bring a field into view). */
    @media (pointer: fine) { html, body { overflow: hidden; overscroll-behavior: none; } }
    body { background: var(--bg); }
    #bq-app { height: 100%; }
  </style>
</head>
<body>
  <div id="bq-app" class="bq-app"></div>
  <script src="/teacher/watch-config.js"></script>
  <script src="/md.js"></script>
  <script src="/app.js"></script>
  <script src="/teacher/watch-frame.js"></script>
</body>
</html>
